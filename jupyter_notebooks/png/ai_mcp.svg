  <text x="440" y="188" text-anchor="middle" font-size="11" fill="#555" font-style="italic">...your own functions</text>
  <rect x="570" y="80" width="130" height="100" fill="#e6ffe6" stroke="#3aa03a" rx="8"/>
  <text x="635" y="105" text-anchor="middle" font-size="13" font-weight="bold">Agent Skills</text>
