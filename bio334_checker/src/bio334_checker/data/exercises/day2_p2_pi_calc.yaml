description_md: |
  ## Day 2, Part 2 — Exercise 1: Calculate π (inline, no functions yet)

  ### Goal
  Read an aligned FASTA file, compute the nucleotide diversity π
  inline (no function refactor yet — that comes in Ex 2).

  ### Formula
  For *n* aligned sequences of length *L*:

  $$\pi = \frac{1}{\binom{n}{2}} \sum_{i<j} \frac{d_{ij}}{L}$$

  where $d_{ij}$ is the number of positions where sequences *i* and
  *j* differ.

  ### Template

  ```python
  import sys

  sequences = []
  file = open(sys.argv[1])
  for line in file:
      if not line[0] == ">":
          sequences.append(line.rstrip())
  file.close()

  total_diff = 0
  #
  # Your code here — count pairwise differences across all (i, j),
  # i < j, summed across every position
  #

  num_sequences = len(sequences)
  len_sequence  = len(sequences[0])
  combination   = num_sequences * (num_sequences - 1) / 2     # nC2
  pi            = total_diff / combination / len_sequence

  print("Total differences =", total_diff)
  print("nC2 =", combination)
  print("Length of sequence =", len_sequence)
  print("pi =", pi)
  ```

  ### Expected output (canonical, for the 1000-sequence alignment
  the gist uses)

  ```
  $ python3 day2_2_exercise1.py input.fa
  Total differences = 336408
  nC2 = 499500.0
  Length of sequence = 10
  pi = 0.06734894894894895
  ```

  ### Notes
  - This exercise is graded by the **LLM only**: the grader reads
    your code and reasons about correctness. You do NOT need to
    match a specific numeric output, because the canonical numbers
    in the gist come from a 1000-sequence alignment we don't ship.
    Your local `input.fa` will produce different numbers — that's
    expected.
  - The next exercise (Ex 2) refactors this same logic into
    `load_fasta(path)` + `calc_pi(sequences)` functions.

rubric_md: |
  Score this submission against the following criteria.

  Required (full credit):
  1. Iterates over **unique pairs** (i, j) with `i < j`. Does NOT
     double-count (i, j) and (j, i).
  2. For each pair, sums positional mismatches across length L.
  3. Computes nC2 as `n * (n - 1) / 2` (floating-point division).
  4. Divides total_diff by nC2 then by L (the formula's two
     denominators) — equivalent expressions are fine.
  5. Prints the four canonical-labeled lines in the right order.
  6. Code runs cleanly given a valid aligned FASTA input.

  Partial credit guidance:
  - Off-by-one (double-counts pairs, or includes (i, i)): 45–60.
    Flag the `i < j` requirement explicitly.
  - Computes per-pair mismatch but forgets to divide by L: 55–70.
    Pi has units of "fraction of sites different", not "raw count".
  - Uses `itertools.combinations(range(n), 2)`: full credit, praise
    the idiom.
  - Hardcodes the canonical 336408 / 499500 / pi value with no
    actual loop: well below LLM_FLOOR.

  Style notes:
  - Day-2 stage: an explicit nested loop is fine.
  - One-liner with sum / generator-expression is OK if the student
    is comfortable; flag it as a stretch.

  Feedback:
  - Acknowledge the algorithmic core (pairwise loop) first.
  - If wrong, point at which of {pair iteration, positional diff,
    nC2 formula, division by L} is the broken piece.

# No expected_stdout → grader skips exact-match and the
