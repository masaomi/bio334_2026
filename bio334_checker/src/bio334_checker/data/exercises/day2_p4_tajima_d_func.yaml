description_md: |
  ## Day 2, Part 4 — Exercise 2: Refactor into a function

  ### Goal
  Take the full Tajima's D computation from Ex 1 and wrap it in a
  reusable function `tajimas_d(sequences)`.

  ### Required interface

  ```python
  import sys

  def load_fasta(path):
      sequences = []
      #
      # Your code here
      #
      return sequences

  def tajimas_d(sequences):
      #
      # Reuse Day 2 P2 calc_pi + Day 2 P3 segregating-site count.
      # Compute the eight variance constants (a1, a2, b1, b2, c1, c2,
      # e1, e2) and return D = d / sqrt(e1*S + e2*S*(S-1)).
      #
      return td

  sequences = load_fasta(sys.argv[1])
  td = tajimas_d(sequences)
  print("Tajima's D=", td)
  ```

  ### Expected output (canonical, 1000-seq alignment)

  ```
  $ python3 day2_4_exercise2.py input.fa
  Tajima's D= 1.6921137265021378
  ```

  Your value will differ if you test on a different alignment.

  ### Notes
  - **LLM-only grading**: the canonical 1.69 value is reproducible
    only with the gist's 1000-sequence alignment. The rubric reads
    your code; it does not require the canonical number.
  - **n=2 is undefined**: when there are only 2 sequences the
    variance denominator becomes 0. Your `tajimas_d` should handle
    this gracefully (raise, return `nan`, or print a clear
    diagnostic) — not silently divide by zero.

rubric_md: |
  Score against:

  Required (full credit):
  1. `load_fasta(path)` correctly parses FASTA.
  2. `tajimas_d(sequences)` is a single function (not multiple
     wrappers) that returns the D statistic.
  3. The function internally:
     - computes π via the Day 2 P2 logic (reuse `calc_pi` if defined)
     - counts segregating sites S via the Day 2 P3 logic
     - computes a1, a2, b1, b2, c1, c2, e1, e2 with their textbook
       formulae (see Wikipedia: Tajima's D)
     - returns `d * L / sqrt(e1*S + e2*S*(S-1))` (or equivalent)
  4. Handles n=2 without silent divide-by-zero.
  5. Script body calls `tajimas_d(load_fasta(sys.argv[1]))` and
     prints `Tajima's D= <value>`.

  Partial credit guidance:
  - All math inline (no function decomposition): 50–65; the lesson
    of Ex 2 IS the function refactor.
  - One of the variance constants formulated wrong: 65–80; flag the
    specific constant in feedback.
  - Doesn't reuse calc_pi or count_seg_sites and re-implements
    inside `tajimas_d`: 70–85 — works, but DRY suffers.

  Style notes:
  - The eight-constant computation reads more naturally as
    step-by-step variable assignments than as a single expression.
    Both styles are fine for grading.

