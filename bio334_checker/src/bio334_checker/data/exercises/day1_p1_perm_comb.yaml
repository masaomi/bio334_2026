description_md: |
  ## Day 1, Part 1 — Advanced Exercise 1: Permutation and combination

  ### Goal
  Implement nPr (permutation) and nCr (combination) given `n = 5`
  and `r = 2`, and print the result in the canonical 6-decimal format.

  ### Background
  When selecting `r` elements from a group of `n`:

  - **Permutation** (order matters):

    $${}_nP_r = \frac{n!}{(n - r)!}$$

  - **Combination** (order does not matter):

    $${}_nC_r = \frac{n!}{r!\,(n - r)!}$$

  Example: selecting 2 people from 5 — (A, B) and (B, A) are two
  different permutations but the same combination.

  ### Expected output

  ```
  $ python day1_1_advanced1.py
  5P2 = 20.000000
  5C2 = 10.000000
  ```

  ### Notes
  - Use `float()` (or the `%f` formatter) so the output has 6
    decimal places matching the canonical exactly.
  - You may import `math` and use `math.factorial`, or write your
    own factorial loop — both are acceptable.

rubric_md: |
  Score this submission against the following criteria.

  Required (full credit):
  1. Computes `n!` correctly (either via `math.factorial` or a
     manual loop).
  2. nPr = n! / (n-r)! → 20 for (5, 2).
  3. nCr = n! / (r! * (n-r)!) → 10 for (5, 2).
  4. Prints both lines in the canonical 6-decimal format using
     `%f` (or `f"{value:.6f}"`).
  5. Code runs cleanly (exit code 0).

  Partial credit guidance:
  - Correct values but printed as integers (e.g., `5P2 = 20`):
    65–80, flag the format mismatch. The disagreement banner is the
    lesson here.
  - Hard-coded `n` and `r` is fine for this exercise; the gist
    specifies fixed values.
  - Off-by-one in factorial (e.g., includes `0!` incorrectly): 50–70.

  Style notes:
  - Pure-Python `math.factorial` is the cleanest path. Writing a
    factorial function is also fine for review purposes.

expected_stdout: |
  5P2 = 20.000000
  5C2 = 10.000000

