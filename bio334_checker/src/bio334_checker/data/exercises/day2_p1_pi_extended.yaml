description_md: |
  ## Day 2, Part 1 — Exercise 1: Genome size from FASTA

  ### Goal
  Understand `sys.argv` (command-line arguments) and basic file I/O.

  ### Task
  Load a FASTA file whose path is given on the command line, and
  calculate the genome size (total nucleotide count, ignoring header
  lines that start with `>`).

  ### Template

  ```python
  import sys

  genome_size = 0
  file = open(sys.argv[1])
  for line in file:
      #
      # Your code here
      #
  file.close()

  print("genome size =", genome_size, "bp")
  ```

  ### Expected output

  ```
  $ python day2_1_exercise1.py athal_genome.fa
  genome size = 119667750 bp
  ```

  ### Input file
  - `athal_genome.fa` — the *Arabidopsis thaliana* genome FASTA file.
    The checker provides this as a symlink in the sandbox working
    directory; reference it as `athal_genome.fa` from your code.

rubric_md: |
  Score against:

  Required (full credit):
  1. Reads the file path from `sys.argv[1]` (do not hardcode the path).
  2. Iterates over the file line-by-line (using `for line in file`).
  3. **Skips header lines starting with `>`** — these are FASTA
     description lines, not sequence data.
  4. Sums up the length of each sequence line, **after stripping
     the trailing newline** (`line.rstrip()` or `line.strip()` or
     `len(line) - 1`). Forgetting the newline gives an off-by-N
     answer.
  5. Prints exactly `genome size = 119667750 bp`.
  6. Code runs cleanly.

  Partial credit guidance:
  - Off-by-N because newline was not stripped: 60–75; explain.
  - Counted header lines too: 50–65; explain.
  - Correct algorithm but wrong number due to a typo: 70–85.
  - Output-only fakery: below LLM_FLOOR.

  Style notes:
  - `with open(sys.argv[1]) as f:` is more Pythonic but the template
    uses the explicit open/close pattern — either is fine.
  - `genome_size += len(line.rstrip())` is the idiomatic one-liner.

  Feedback:
  - Confirm whether the header-skip step is present.
  - Confirm whether the newline strip is present.
  - If the wrong number, suggest printing a few line lengths first to
    debug.

expected_stdout: "genome size = 119667750 bp\n"

