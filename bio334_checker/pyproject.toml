[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bio334-checker"
version = "0.1.0.dev0"
description = "LLM-augmented exercise checker for BIO334 Practical Bioinformatics (UZH 2026)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Masaomi Hatakeyama", email = "masaomi.hatakeyama@fgcz.uzh.ch"},
]
keywords = ["bioinformatics", "teaching", "exercise-checker", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "fastapi>=0.104",
    "uvicorn>=0.24",
    "jinja2>=3.1",
    "anthropic>=0.40",
    "pyyaml>=6.0",
    "qrcode[pil]>=7.4",
    "markdown-it-py>=3.0",
    "python-multipart>=0.0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27,<0.28",
]

[project.scripts]
bio334-checker = "bio334_checker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bio334_checker = [
    "db/*.sql",
    "data/exercises/*.yaml",
    "data/prompts/*.md",
    "interfaces/web/templates/*.html",
    "static/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
