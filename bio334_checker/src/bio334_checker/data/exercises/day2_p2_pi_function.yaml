description_md: |
  ## Day 2, Part 2 — Exercise 2: Nucleotide diversity as a function

  ### Goal
  Refactor the nucleotide-diversity calculation into two functions:

  - `load_fasta(path)` — reads an aligned FASTA file and returns a list
    of sequences.
  - `calc_pi(sequences)` — computes π given the loaded sequences.

  ### Formula
  For *n* aligned sequences of length *L*:

  $$\pi = \frac{1}{\binom{n}{2}} \sum_{i<j} \frac{d_{ij}}{L}$$

  where $d_{ij}$ is the number of positions where sequences *i* and *j*
  differ.

  ### Template

  ```python
  import sys

  def load_fasta(fasta):
      sequences = []
      #
      # Your code here
      #
      return sequences

  def calc_pi(sequences):
      #
      # Your code here
      #
      return pi

  sequences = load_fasta(sys.argv[1])
  pi = calc_pi(sequences)
  print("pi =", pi)
  ```

  ### Input
  Your script receives an aligned FASTA file path as the first command
  line argument. You can test locally with any small alignment.

  ### Notes
  - This exercise is graded by the **LLM only**: the grader reads your
    code and reasons about correctness of the algorithm and the
    function design. You do NOT need to match a specific numeric
    output, because the canonical numbers in the gist come from a
    1000-sequence alignment we don't ship.

rubric_md: |
  Score this submission against the following criteria.

  Required (full credit):
  1. `load_fasta(fasta)` correctly parses a FASTA file: skips header
     lines (`>`...), accumulates sequence lines, strips newlines.
  2. `calc_pi(sequences)` correctly implements the π formula:
     - sums pairwise differences across every (i, j) with i < j;
     - divides by `nC2 = n*(n-1)/2` and the sequence length L;
     - handles n ≥ 2 (does not crash on n=2, returns 0 cleanly on n=1).
  3. Functions return values; the script body calls them and prints
     `pi = <value>`.

  Partial credit guidance:
  - Algorithm correct but everything inlined in `__main__` (no
    functions): 50–65 — the lesson of this exercise IS function design.
  - Uses double-counting (i,j AND j,i pairs): 55–70 — flag the off-by-2
    bug and explain `i < j`.
  - Hardcoded denominator (assumes n=2 or specific n): 40–55.
  - Reuses the per-position approach from Day 1 Part 3 cleanly:
    full credit; that's a valid refactor target.

  Style notes:
  - `itertools.combinations(range(n), 2)` is a clean idiom and worth
    praising if used.
  - Functions should have small, clear bodies; if `calc_pi` is more
    than ~15 lines, suggest breaking out a `pairwise_diff` helper.

  Feedback:
  - Acknowledge function design choices explicitly.
  - If the student wrote a one-liner with comprehensions, praise it but
    also remind them readability matters for biology collaborators.

