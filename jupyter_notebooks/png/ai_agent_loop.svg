<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280">
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>
  <rect x="60" y="110" width="120" height="60" fill="#e6f0ff" stroke="#3366aa" rx="8"/>
  <text x="120" y="135" text-anchor="middle" font-size="14" font-weight="bold">1. Plan</text>
  <text x="120" y="155" text-anchor="middle" font-size="11" fill="#555">decide steps</text>
  <rect x="240" y="110" width="120" height="60" fill="#e6ffe6" stroke="#3aa03a" rx="8"/>
  <text x="300" y="135" text-anchor="middle" font-size="14" font-weight="bold">2. Execute</text>
  <text x="300" y="155" text-anchor="middle" font-size="11" fill="#555">edit files, run cmd</text>
  <rect x="420" y="110" width="120" height="60" fill="#fff2cc" stroke="#cc9933" rx="8"/>
  <text x="480" y="135" text-anchor="middle" font-size="14" font-weight="bold">3. Verify</text>
  <text x="480" y="155" text-anchor="middle" font-size="11" fill="#555">read output, test</text>
  <line x1="180" y1="140" x2="235" y2="140" stroke="#444" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="360" y1="140" x2="415" y2="140" stroke="#444" stroke-width="2" marker-end="url(#a2)"/>
  <path d="M 480 175 Q 480 240 300 240 Q 120 240 120 175" fill="none" stroke="#444" stroke-width="2" marker-end="url(#a2)" stroke-dasharray="5,4"/>
  <text x="300" y="232" text-anchor="middle" font-size="11" fill="#555" font-style="italic">repeat until done (or stuck)</text>
  <rect x="590" y="50" width="120" height="180" fill="#f4f4f4" stroke="#999" rx="6"/>
  <text x="650" y="72" text-anchor="middle" font-size="13" font-weight="bold">tools</text>
  <text x="650" y="96" text-anchor="middle" font-size="11">read_file</text>
  <text x="650" y="116" text-anchor="middle" font-size="11">write_file</text>
  <text x="650" y="136" text-anchor="middle" font-size="11">run_command</text>
  <text x="650" y="156" text-anchor="middle" font-size="11">search_web</text>
  <text x="650" y="176" text-anchor="middle" font-size="11">open_browser</text>
  <text x="650" y="200" text-anchor="middle" font-size="11" fill="#555" font-style="italic">. . .</text>
  <text x="360" y="30" text-anchor="middle" font-size="15" font-weight="bold">The agent loop</text>
  <text x="360" y="50" text-anchor="middle" font-size="12" fill="#666">LLM in the middle, tools on the side, repeat until task done</text>
</svg>
