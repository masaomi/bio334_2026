description_md: |
  ## Day 2, Part 3 — Advanced Exercise 2: MAF

  ### Goal
  At each segregating site, also compute the **Minor Allele
  Frequency (MAF)**: the frequency of the less-common allele.

  Example: at a position where 3 of 4 sequences carry `A` and 1
  carries `T`, the frequencies are A=3/4, T=1/4, so MAF = 1/4.

  ### Required output format
  Same shape as Day 2 P3 Ex 1's per-position printout, with the
  MAF appended to the verdict for segregating positions:

  ```
  ['G']	not segregating
  ['A']	not segregating
  ['A']	not segregating
  ['G']	not segregating
  ['A']	not segregating
  ['C', 'T']	segregating, MAF= 0.500
  ['T']	not segregating
  ['A', 'T']	segregating, MAF= 0.500
  ['G']	not segregating
  ['T']	not segregating
  Total segregating sites = 2
  ```

  Notes on the format string:
  - Tab between the alleles list and the verdict.
  - For segregating positions, append `, MAF= ` (comma + space +
    `MAF=` + **one space** before the number) then `%.3f` of the
    MAF value.
  - For n=2 sequences (the bundled input), every segregating site
    necessarily has alleles 1:1 → MAF = 0.500.

  ### Hint
  - `collections.Counter` on the per-position allele list gives you
    the frequencies in one call. `Counter(...).most_common()[-1][1]`
    is the minor-allele count.
  - MAF = `minor_count / n`.

rubric_md: |
  Score against:

  Required (full credit):
  1. Per-position printout matches the canonical exactly (list
     literal of alleles, tab, verdict).
  2. For segregating sites, appends `, MAF= ` then `%.3f` of the
     minor-allele frequency. The exact format string is the
     differentiator from "looks similar but wrong" attempts.
  3. Total segregating sites count is correct (2 for the bundled
     input).
  4. Code runs cleanly.

  Partial credit guidance:
  - MAF computed but wrong format (`MAF=0.500` no space, or
    `MAF = 0.500` with extra space, or `0.5` not `0.500`): 75–90.
    The disagreement banner becomes the lesson on print-format
    discipline.
  - MAF computed as MAJOR allele freq (e.g., 0.500 also "looks
    right" on n=2, but on n>2 would be wrong): 70–80. Flag that
    minor means "less common".
  - Site classification correct but MAF not appended at all:
    50–65.

  Style notes:
  - `from collections import Counter` is the textbook idiom.
  - Manual frequency dictionary is fine but slower to write.

