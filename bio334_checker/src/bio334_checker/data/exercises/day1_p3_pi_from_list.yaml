description_md: |
  ## Day 1, Part 3 — Advanced Exercise 1: Nucleotide diversity (π)

  ### Goal
  Given a hard-coded list of three aligned DNA sequences, compute:

  - Total number of pairwise nucleotide differences (D)
  - Number of pairs (nC2)
  - Mean pairwise difference (PI = D / nC2)
  - Nucleotide diversity (π = PI / L), where L is the sequence
    length

  ### Input (hard-coded)

  ```python
  sequences = ['ATGC', 'ATAT', 'ATGC']
  ```

  ### Expected output

  ```
  $ python day1_3_advanced1.py
  Sequences = ['ATGC', 'ATAT', 'ATGC']
  Total differences = 4
  nC2 = 3.0
  Length of sequence = 4
  Mean pairwise difference PI = 1.3333333333333333
  pi = PI/(Length of sequence) = 0.3333333333333333
  ```

  ### Formula

  Let *n* = number of sequences, *L* = length, *D* = total
  differences across all (i, j) pairs with i < j.

  - nC2 = n*(n-1)/2 (use floating-point: `3.0`, not `3`)
  - PI  = D / nC2
  - π   = PI / L

  ### Hint
  - Triple nested loop:
    1. outer: pairs (i, j) with `range(0, len(sequences))` and
       `range(i+1, len(sequences))`
    2. inner: positions (k) with `range(0, len(sequences[0]))`
  - Use `len(sequences)` for *n* and `len(sequences[0])` for *L*.

rubric_md: |
  Score this submission against the following criteria.

  Required (full credit):
  1. Counts pairwise differences with `i < j` (no double-counting).
     For the canonical input, D = 4.
  2. Computes nC2 as a **float** (3.0 prints, not 3). Either
     `n*(n-1)/2.0` or explicit `float()` is fine.
  3. Computes PI = D / nC2 → 1.3333333333333333.
  4. Computes π = PI / L → 0.3333333333333333.
  5. Prints six lines matching the canonical labels and ordering
     exactly (note the `Sequences = [...]` line uses the default
     Python list-repr, including single quotes).

  Partial credit guidance:
  - Algorithm correct but nC2 printed as integer (`3` not `3.0`):
    75–85; disagreement banner is the lesson on int/float coercion.
  - Off-by-one (counts (i, i) pairs or double-counts (j, i)):
    45–60.
  - Wrong divisor (divides D by L only, never by nC2): 30–45.

  Style notes:
  - Reusing Day 1 P3 Ex 2 logic is the natural path; explicit
    `itertools.combinations` is fine.

