description_md: |
  ## Day 2, Part 4 — Advanced Exercise 1: Fay and Wu's H

  ### Goal
  Add **Fay and Wu's H** statistic alongside Tajima's D. Both
  statistics test for departures from neutrality, but they detect
  different kinds of selection:

  - **Tajima's D**: compares π vs Watterson's θ (sensitive to
    rare alleles vs balanced polymorphism).
  - **Fay & Wu's H**: compares π vs θ_H (sensitive to
    **high-frequency derived alleles**, the signature of a
    selective sweep).

  ### Formula sketch

  $$\theta_H = \frac{\sum_{i=1}^{n-1} i^2 \, S_i}{\binom{n}{2}}$$

  where $S_i$ is the count of segregating sites at which the
  derived allele has frequency $i/n$.

  Then:

  $$H_{FW} = \pi - \theta_H \quad (\text{or}\ \theta_H - \pi
  \text{ — pick one and label clearly})$$

  ### Inputs
  - `input.fa` — ingroup FASTA (argv[1])
  - `outgroup.fa` — outgroup FASTA (argv[2]), one sequence,
    used to identify the ancestral allele at each site

  ### Required functions
  - `load_fasta(path)` — reuse
  - `calc_pi(sequences)` — reuse
  - `tajimas_d(sequences)` — reuse from Ex 2
  - `fay_wu_h(ingroup_sequences, outgroup_sequence)` — new

  ### Expected output

  ```
  $ python day2_4_advanced1.py input.fa outgroup.fa
  Tajima's D = 1.6921137265021378
  Fay and Wu's H = -0.979493893893894
  ```

  Negative H ⇒ excess of high-frequency derived alleles ⇒ possible
  positive selection (selective sweep). Positive H ⇒ excess at
  intermediate frequency. H ≈ 0 ⇒ neutral.

  ### Notes
  - **LLM-only grading**: the canonical numbers come from the
    1000-seq ingroup and a matched outgroup that we don't bundle.
    Test with your own files.
  - **Sign convention**: papers vary. State which convention you
    used (in a code comment or the print label), and use it
    consistently.

  ### Hint
  - Reuse Day 2 P3 Adv 3 (DAF) logic for the ancestral lookup.
  - For each segregating site, derived allele frequency = i/n;
    accumulate `i^2` (the weight) across all such sites and divide
    by nC2 at the end.

rubric_md: |
  Score against:

  Required (full credit):
  1. Reads ingroup from argv[1], outgroup from argv[2].
  2. Computes Tajima's D via the Ex 2 / Wikipedia formula.
  3. Computes θ_H by weighting each segregating site by `i^2`
     where i is the derived-allele count in the ingroup.
  4. Returns H = π − θ_H (or θ_H − π) consistently. Sign convention
     must be visible (in a comment, the print label, or a
     docstring).
  5. Handles the "ancestral allele not in ingroup" case gracefully
     (skip the site, or assign weight 0 — whichever the student
     justifies).
  6. Prints two labelled lines matching the canonical layout.

  Partial credit guidance:
  - Computes H but with the wrong weight (i, or i*(n-i), instead
    of i²): 50–70. Reference the formula explicitly in feedback.
  - Sign convention not stated; can't tell from code/output which
    is in use: 70–85. The lesson is "declare your convention".
  - Mixes Tajima's D and Fay&Wu's H into one function: 60–75.
    Two separate functions is the design goal.

  Style notes:
  - `tajimas_d` and `fay_wu_h` should both take a sequence list
    (Fay&Wu also taking the outgroup separately). Compose, don't
    duplicate.

