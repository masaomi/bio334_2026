description_md: |
  ## Day 3, Advanced Exercise 1: per-gene π + plot

  ### Goal
  Take Ex 2's chromosome-wide π computation and **decompose by
  gene**: for each gene annotated in `TAIR10_chr1.gff`, compute the
  π that uses only SNPs within that gene's coordinates, then plot
  the per-gene π values across the chromosome.

  Genes with **noticeably lower π** are candidate regions under
  selection — that's the biological interpretation this exercise
  is illustrating.

  ### Data (download from course materials)
  - `Athaliana_SNPs/*.txt` — 5 accessions, SNPs on chromosome 1
    (same as Ex 2)
  - `TAIR10_chr1.fas` — reference sequence
  - `TAIR10_chr1.gff` — gene annotation. Each gene line:
    ```
    Chr1  TAIR10  gene  3631  5899  . + . ID=AT1G01010;...
    ```
    - Column 3: feature type (filter to `gene`)
    - Column 4: start position
    - Column 5: end position
    - Column 9: attributes (extract `ID=AT...` as the GeneID)

  ### Two valid approaches

  1. **Direct on SNP dicts**: from Ex 2's per-accession SNP dict,
     restrict to positions inside `[start, end]` per gene; compute
     π per gene with `L_gene = end - start + 1` as the denominator.
  2. **Per-gene FASTA + Day 2 P2**: build a per-gene multiple
     alignment then reuse `calc_pi`. Slower but clearer.

  ### Output
  - A TSV (`Athaliana_chr1_genes_pi.dat`) with columns
    `GeneID\tpi` for every gene that has at least one SNP in any
    accession. Genes with zero SNPs may be skipped or emitted with
    π = 0 (declare your choice in a comment).
  - A PNG (`Athaliana_chr1_genes_pi.png`) plotting π on the y-axis
    against gene index (or genomic position) on the x-axis. See
    the gist for a sample plot.

  ### Grading note
  This exercise is graded by the **LLM only**, on **code review
  alone** — the grader does NOT run your script (matplotlib not
  guaranteed in the sandbox; data not bundled). Submit the code
  plus brief design comments at the top describing:

  1. Which approach you took (direct-on-dicts vs FASTA-rebuild).
  2. How you handled genes with zero SNPs.
  3. What candidate gene(s) you spot as the lowest-π regions
     (one sentence is fine — this is the biological reading of
     the result).

rubric_md: |
  Score against:

  Required (full credit):
  1. Parses `TAIR10_chr1.gff`, filters to `gene` rows, extracts
     `start`, `end`, and `GeneID` (from the `ID=` field in column 9).
  2. Restricts SNP positions per gene using the [start, end]
     interval — open interval at one end is OK if labelled, but
     L_gene = end − start + 1 must be the divisor.
  3. Reuses Ex 2's pair-wise difference logic per gene, not from
     scratch — call out the function in a comment.
  4. Emits the per-gene TSV (or in-memory equivalent) and the plot.
  5. Hypothesis comment at the top names ≥ 1 candidate low-π gene
     observed locally (with caveat that the value depends on the
     accession set).

  Partial credit guidance:
  - Per-gene π computed but uses len(SNP positions in the gene) as
    L_gene instead of end − start + 1: 50–65 — flag the
    biological-vs-counts distinction.
  - Plot but no TSV: 70–85 (the TSV is the durable record).
  - TSV but no plot: 65–80 (the plot is the deliverable).
  - Hypothesis comment missing entirely: 70–85 — biological
    reasoning is part of the assignment.

  Style notes:
  - `pandas.read_csv(gff_path, sep="\t", comment="#", header=None)`
    is the natural pandas idiom.
  - Bisect / np.searchsorted on the sorted SNP positions gives
    O(log n) range queries per gene; nested loops also work.
  - For the plot: rotate x labels (`plt.xticks(rotation=45)`),
    save with `plt.savefig(...)` not `plt.show()`.

# No expected_stdout → exact-match skipped, rubric grades code +
# hypothesis. allow_nonzero_rc=true so missing matplotlib / pandas /
# data in the sandbox doesn't block grading.

