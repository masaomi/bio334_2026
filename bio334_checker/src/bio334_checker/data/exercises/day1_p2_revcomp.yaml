description_md: |
  ## Day 1, Part 2 — Advanced Exercise 2: Reverse complement

  ### Goal
  Compute the **reverse complement** of a hard-coded DNA sequence.

  ### Background
  DNA bases pair as A↔T and G↔C. The reverse complement of a strand
  is obtained by:

  1. Replacing each base with its complement.
  2. Reversing the resulting string.

  This matters in bioinformatics because DNA is double-stranded and
  often reported in reverse-complement form.

  ### Input (hard-coded)
  ```
  ATGCATGCATGCATGCATATATGCATGC
  ```

  ### Expected output

  ```
  $ python day1_2_advanced2.py
  ATGCATGCATGCATGCATATATGCATGC
  GCATGCATATATGCATGCATGCATGCAT
  ```

  ### Hints
  - A dictionary `{"A": "T", "T": "A", "G": "C", "C": "G"}` is the
    cleanest mapping.
  - `"".join(...)` is the standard way to build a string from a
    list of characters.
  - `"abc"[::-1]` reverses a string in Python.

rubric_md: |
  Score this submission against the following criteria.

  Required (full credit):
  1. Builds a complement of the input by mapping A→T, T→A, G→C,
     C→G (any idiom: dict + comprehension, `str.translate`, manual
     `if/else` chain).
  2. Reverses the complemented string (slice `[::-1]`, `reversed()`,
     or manual reverse loop).
  3. Prints the original input on line 1, the reverse-complement on
     line 2.
  4. Code runs cleanly (exit code 0).

  Partial credit guidance:
  - Complement OK but forgets to reverse (just prints the
    complement): 50–65 — flag the missing reverse step.
  - Reverse OK but forgets to complement (just reverses the
    original): 50–65.
  - Uses Biopython (`Seq("...").reverse_complement()`): full credit
    but praise the manual-implementation alternative as more
    learning value.
  - Hard-coded output string with no algorithm: well below
    LLM_FLOOR.

  Style notes:
  - `str.maketrans` + `str.translate` is a clean idiom worth
    pointing out.
  - Dict + comprehension (`"".join({"A":"T",...}[b] for b in seq)`)
    is the most "review of basics" style choice.

expected_stdout: |
  ATGCATGCATGCATGCATATATGCATGC
  GCATGCATATATGCATGCATGCATGCAT

