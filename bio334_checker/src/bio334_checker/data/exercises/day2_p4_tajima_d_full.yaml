description_md: |
  ## Day 2, Part 4 — Calculate Tajima's D

  ### Goal
  Combine nucleotide diversity (π, from Day 2 Part 2) and the count of
  segregating sites (S, from Day 2 Part 3) into the full Tajima's D
  statistic, which detects departures from the neutral evolution
  model.

  ### Formula sketch

  - Watterson's estimator: $\hat{\pi}_W = \frac{S}{a_1}$ where
    $a_1 = \sum_{i=1}^{n-1} \frac{1}{i}$.
  - $d = \pi - \hat{\pi}_W$.
  - Tajima's D normalises *d* by an estimate of its standard deviation
    involving constants $a_1$, $a_2$, $b_1$, $b_2$, $c_1$, $c_2$,
    $e_1$, $e_2$ — see the Wikipedia page for the closed-form formula.

  See [Wikipedia: Tajima's D](https://en.wikipedia.org/wiki/Tajima%27s_D)
  for the full closed-form derivation.

  ### Required functions
  Define a function `tajimas_d(sequences)` that returns the full D
  statistic given a list of aligned sequences. Reuse `load_fasta` and
  `calc_pi` from earlier exercises.

  ### Expected printout (canonical example, n=1000)
  ```
  Tajima's D = 1.6921137265021378
  ```

  Your numbers will differ if you test on a smaller alignment — that
  is fine. The grader reads your code, not your numbers.

  ### Notes
  - This exercise is graded by the **LLM only**. Tajima's D is
    undefined when n=2 (the variance denominator becomes 0), so we
    deliberately do not pin a canonical small-input output.
  - The full formula involves eight named constants. Either compute
    them step-by-step (clearer for learning) or in one expression
    (more concise) — both are acceptable.

rubric_md: |
  Score this submission against the following criteria.

  Required (full credit):
  1. Reuses or re-implements `load_fasta` and a way to count
     segregating sites S (Day 2 Part 3 territory).
  2. Computes π correctly (Day 2 Part 2 territory).
  3. Computes $a_1 = \sum 1/i$ for i = 1..n-1.
  4. Computes Watterson's $\hat{\pi}_W = S / a_1$ (or equivalently
     uses the per-site form $s / a_1 \cdot L$ — both correct).
  5. Computes $d = \pi - \hat{\pi}_W$.
  6. Computes the variance estimator and divides $d$ by its square
     root to get Tajima's D. The eight constants (a1, a2, b1, b2,
     c1, c2, e1, e2) must all appear with the correct formulae.
  7. Handles n=2 gracefully (e.g., raises, returns `nan`, or prints a
     diagnostic) — does NOT silently divide by zero.

  Partial credit guidance:
  - π and S correct but variance formula wrong / missing some
    constants: 55–70.
  - Variance formula correct but a sign or off-by-one in the
    constants: 65–80 — flag the specific constant.
  - Output matches the gist's n=1000 example value of ~1.69 on the
    student's chosen alignment: not directly required (we don't have
    the canonical input), but a reasonable D value (|D| < 5) on any
    real alignment is a good sanity check.

  Style notes:
  - For pedagogy, prefer the step-by-step constant computation over a
    one-line formula — easier to debug and easier to grade.
  - Using `from math import log, sqrt` etc. is fine.

  Feedback:
  - If π or S is wrong, point back to Day 2 Part 2 or Part 3
    explicitly — the student should be reusing those, not rewriting.

