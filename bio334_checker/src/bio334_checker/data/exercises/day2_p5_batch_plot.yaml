description_md: |
  ## Day 2, Part 5 — Advanced Exercise 1: Batch + plot

  ### Goal
  Extend Ex 1 with a **visualization step**: after computing π and
  Tajima's D for every gene in the HMA4-region alignment
  directories, produce a plot that compares the two origins
  (Ahal vs Alyr).

  ### Two-script architecture (recommended)

  Submitting **one orchestrator script** is fine, but the cleaner
  design is two scripts:

  1. `day2_5_advanced1.py` — same logic as Ex 1, emits a TSV per
     origin (`pi_ahal.dat`, `pi_alyr.dat`).
  2. `plot_hma4.py` — reads the two TSV files with pandas and
     plots π (and/or Tajima's D) on the y-axis with GeneID on the
     x-axis. Save as `hma4_pi.png` or show interactively.

  See the gist for sample matplotlib and R code.

  ### Plot recommendations

  - Both origins on the same axes for direct comparison.
  - Rotate the GeneID labels (`plt.xticks(rotation=45)` is fine).
  - Save the figure: `plt.savefig("hma4_pi.png")` rather than
    `plt.show()` so the result survives the run.

  ### Grading note
  This exercise is graded by the **LLM only**, on **code review
  alone** — the grader does NOT run your script (matplotlib is
  not guaranteed in the sandbox; the HMA4 archives are not
  bundled). Submit your code with brief comments explaining your
  plot-design choices (one or two lines is plenty).

  ### What to submit
  - Your modified batch script (or the orchestrator + plotter pair).
  - A short comment block at the top of the main script naming the
    figure file you would produce and what feature you used to
    highlight the Ahal-vs-Alyr difference (colour, panels, etc.).

rubric_md: |
  Score against:

  Required (full credit):
  1. Code reuses Ex 1's per-file π + Tajima's D computation
     (either by import or by inline reuse of `calc_pi` /
     `tajimas_d` functions).
  2. Generates one TSV per origin OR feeds the per-file results
     directly into the plotting layer.
  3. Calls matplotlib (or R via subprocess) to produce a plot
     comparing the two origins. Both series plotted on shared
     axes is the natural choice; faceted subplots are also fine.
  4. Saves the figure (`plt.savefig(...)`) rather than only
     calling `plt.show()` — otherwise the result vanishes when
     the script exits.
  5. The plot's intent is articulated: a comment, the axis labels,
     or the legend tell the reader what we're looking at.

  Partial credit guidance:
  - Computes the TSVs but no plot at all: 50–65 — that's Ex 1, not
    Adv 1.
  - Plots but only one origin (the Adv 1 specifically asks for
    "of them", plural): 65–80.
  - `plt.show()` without `savefig`: 75–85 — works interactively,
    but unhelpful for handing in a report.
  - Hardcoded data inline (no actual batch over directory): 40–55.

  Style notes:
  - The gist's example uses matplotlib. R via subprocess is also
    accepted; flag that pure-Python is more portable.
  - `pandas.read_table` is the cleanest way to ingest the TSV.

