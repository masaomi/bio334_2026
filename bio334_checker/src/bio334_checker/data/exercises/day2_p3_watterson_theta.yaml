description_md: |
  ## Day 2, Part 3 — Advanced Exercise 1: Watterson's θ

  ### Goal
  Compute Watterson's theta (θ) — a mutation-rate estimator based
  on the count of segregating sites — and report it alongside π.

  ### Formula

  $$\theta = \frac{S}{a_n \cdot L},\qquad a_n = \sum_{i=1}^{n-1}\frac{1}{i}$$

  - **S**: number of segregating sites (Day 2 P3 Ex 1 territory)
  - **n**: number of sequences
  - **L**: sequence length

  ### Required functions
  - `load_fasta(path)` — reuse from earlier exercises
  - `calc_pi(sequences)` — reuse from Day 2 P2
  - `calc_theta(sequences)` — new

  ### Expected output (for the bundled 2-seq `input.fa`)

  ```
  $ python day2_3_advanced1.py input.fa
  pi = 0.2
  Theta (θ) = 0.2
  ```

  For n=2, S=2, L=10:
  - a_n = 1/1 = 1.0
  - θ = 2 / (1.0 × 10) = 0.2
  - π = 2 / 1 / 10 = 0.2 (only one pair, two differences)

  So **π and θ are equal** on this bundled input. That is correct
  — they tend to converge on small alignments. On larger
  alignments (such as the gist's 1000-sequence example) the two
  estimators give different numbers, which is the whole point of
  having two complementary metrics.

  ### Notes
  - The label literally reads `Theta (θ)` — the lowercase Greek
    theta character must be in the output. Copy-paste `θ` from the
    expected output if your keyboard makes it hard to type.

rubric_md: |
  Score against:

  Required (full credit):
  1. `calc_pi` correctly reuses the Day 2 P2 logic and returns 0.2
     for the bundled input.
  2. `calc_theta` counts segregating sites S, computes
     `a_n = sum(1/i for i in range(1, n))`, and returns
     `S / (a_n * L)` → 0.2 for the bundled input.
  3. Prints two lines matching the canonical labels and ordering:
     `pi = 0.2` then `Theta (θ) = 0.2`.
  4. Code runs cleanly.

  Partial credit guidance:
  - Forgets to subtract 1 in the harmonic sum (uses `range(1, n+1)`
    so a_n = 1.5 for n=2 → theta = 2/(1.5*10) = 0.133...): 60–75.
    This is the classic off-by-one in Watterson's formula.
  - Uses 'S' (capital) somewhere it shouldn't matter, but the
    student labels the line "theta" (lowercase, no parentheses, no
    Greek): 75–85. Disagreement banner is the lesson on exact
    label-string matching.
  - calc_pi inlined into the script body (no function): 60–75 — the
    function-reuse lesson loses credit.

  Style notes:
  - `sum(1.0 / i for i in range(1, n))` is the natural expression.
    Watch out for integer division if Python 2 habits creep in.

