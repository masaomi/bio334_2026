description_md: |
  ## Day 1, Part 2 — Advanced Exercise 1: Mini-BLAST

  ### Goal
  Build a tiny BLAST-like search: slide a 4-base window across a
  reference sequence and report which positions match a query.

  ### Inputs (hard-coded)
  - reference: `ATGCATGCATGCATGCATATATGCATGC`
  - query:     `ATAT`

  ### Required behaviour
  For each starting position `i` from 0 to `len(reference) - 1`,
  print `<position>\t<substring>\tMatch` or `Not match` (tab between
  fields). The substring is `reference[i:i+4]`. Print on **every**
  starting position, even when the remaining bases at the end of the
  string are fewer than 4 — the canonical output below shows the
  truncated 3-, 2-, and 1-character windows at positions 25, 26, 27.

  ### Expected output

  ```
  $ python day1_2_advanced1.py
  0	ATGC	Not match
  1	TGCA	Not match
  2	GCAT	Not match
  3	CATG	Not match
  4	ATGC	Not match
  5	TGCA	Not match
  6	GCAT	Not match
  7	CATG	Not match
  8	ATGC	Not match
  9	TGCA	Not match
  10	GCAT	Not match
  11	CATG	Not match
  12	ATGC	Not match
  13	TGCA	Not match
  14	GCAT	Not match
  15	CATA	Not match
  16	ATAT	Match
  17	TATA	Not match
  18	ATAT	Match
  19	TATG	Not match
  20	ATGC	Not match
  21	TGCA	Not match
  22	GCAT	Not match
  23	CATG	Not match
  24	ATGC	Not match
  25	TGC	Not match
  26	GC	Not match
  27	C	Not match
  ```

  ### Notes
  - Use `reference[i:i+4]` — Python slicing silently truncates near
    the end of the string. That is why positions 25–27 print 3-, 2-,
    and 1-character substrings.
  - If you bound the loop to `len(reference) - 3`, you will produce
    25 lines instead of 28 and the grader will see a disagreement
    with the canonical. **That disagreement is itself a teaching
    moment** about expected-output assumptions — investigate both
    sides before deciding which is "right".

rubric_md: |
  Score this submission against the following criteria.

  Required (full credit):
  1. Hard-codes the reference and query strings from the gist (or
     reads them from somewhere clearly motivated).
  2. Iterates starting positions across the full string (or matches
     the canonical's 28-line behaviour).
  3. Uses Python slicing `ref[i:i+4]` (or equivalent indexing).
  4. Prints tab-separated `<pos>\t<sub>\tMatch|Not match` lines.
  5. Compares `sub == query` and emits `Match` / `Not match`
     correctly. Positions 16 and 18 should be `Match`.

  Partial credit guidance:
  - Bound loop to `len(ref) - 3` (so no truncated 3/2/1-base lines):
    75–90 — algorithmically correct, surface as the disagreement
    banner lesson.
  - Off-by-one such that the matches end up at positions 15/17:
    50–65.
  - Uses `find()` or `re.findall` instead of explicit loop:
    65–80 — acceptable but misses the sliding-window-loop pedagogy.

  Style notes:
  - `for i in range(len(ref))` then `sub = ref[i:i+4]` is the
    intended canonical idiom.

